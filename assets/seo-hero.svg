<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">
  <title id="title">RankMySEO skills: type /seo, the agent plans, builds, publishes, then keeps checking</title>
  <desc id="desc">An animated terminal showing /seo check returning three actions, next to a loop of plan, build, publish, and check, with climbing rank bars.</desc>

  <rect width="1200" height="440" rx="20" fill="#101216"/>

  <!-- Header -->
  <g>
    <rect x="40" y="34" width="14" height="34" rx="4" fill="#FF5C22">
      <animate attributeName="height" values="34;34;34" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="60" y="24" width="14" height="44" rx="4" fill="#FF5C22" opacity="0.75"/>
    <rect x="80" y="14" width="14" height="54" rx="4" fill="#FF5C22" opacity="0.5"/>
    <text x="110" y="48" font-size="30" font-weight="700" fill="#FFFFFF">RankMySEO skills</text>
    <text x="40" y="86" font-size="17" fill="#A7ADB8">SEO for site owners who are not SEO experts. The agent does the work, you approve it.</text>
  </g>

  <!-- Terminal -->
  <g>
    <rect x="40" y="112" width="540" height="288" rx="16" fill="#171A20" stroke="#2B303A" stroke-width="1.5"/>
    <circle cx="68" cy="138" r="6" fill="#FF5C22"/>
    <circle cx="88" cy="138" r="6" fill="#3A3F4A"/>
    <circle cx="108" cy="138" r="6" fill="#3A3F4A"/>
    <text x="128" y="144" font-size="13" fill="#7C828E" font-family="ui-monospace, Menlo, Consolas, monospace">your agent</text>

    <!-- typed command -->
    <clipPath id="typeClip">
      <rect x="64" y="158" width="0" height="30">
        <animate attributeName="width" values="0;0;330;330;0" keyTimes="0;0.08;0.38;0.92;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <text x="64" y="182" font-size="19" fill="#FFFFFF" font-family="ui-monospace, Menlo, Consolas, monospace" clip-path="url(#typeClip)">/seo check example.com</text>
    <rect x="324" y="164" width="10" height="20" fill="#FF5C22">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- results -->
    <g font-size="16.5" fill="#D7DBE2" font-family="ui-monospace, Menlo, Consolas, monospace">
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.40;0.48;0.92;1" dur="9s" repeatCount="indefinite"/>
        <text x="64" y="226" fill="#FF8A5C">1.</text>
        <text x="92" y="226">Rewrite the title on /pricing</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.50;0.58;0.92;1" dur="9s" repeatCount="indefinite"/>
        <text x="64" y="256" fill="#FF8A5C">2.</text>
        <text x="92" y="256">Fix one template H1, 14 pages</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.60;0.68;0.92;1" dur="9s" repeatCount="indefinite"/>
        <text x="64" y="286" fill="#FF8A5C">3.</text>
        <text x="92" y="286">Brief: rank tracker for agencies</text>
      </g>
    </g>

    <!-- climbing bars -->
    <g>
      <line x1="64" y1="356" x2="330" y2="356" stroke="#2B303A" stroke-width="2"/>
      <rect x="76" width="30" rx="4" fill="#3A3F4A">
        <animate attributeName="y" values="338;338;338" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="height" values="18;18;18" dur="9s" repeatCount="indefinite"/>
      </rect>
      <rect x="122" width="30" rx="4" fill="#565E6C">
        <animate attributeName="y" values="356;326;326;326;356" keyTimes="0;0.45;0.6;0.92;1" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="height" values="0;30;30;30;0" keyTimes="0;0.45;0.6;0.92;1" dur="9s" repeatCount="indefinite"/>
      </rect>
      <rect x="168" width="30" rx="4" fill="#8A8F98">
        <animate attributeName="y" values="356;316;316;316;356" keyTimes="0;0.55;0.7;0.92;1" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="height" values="0;40;40;40;0" keyTimes="0;0.55;0.7;0.92;1" dur="9s" repeatCount="indefinite"/>
      </rect>
      <rect x="214" width="30" rx="4" fill="#FF5C22">
        <animate attributeName="y" values="356;304;304;304;356" keyTimes="0;0.65;0.8;0.92;1" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="height" values="0;52;52;52;0" keyTimes="0;0.65;0.8;0.92;1" dur="9s" repeatCount="indefinite"/>
      </rect>
      <text x="262" y="330" font-size="15" fill="#A7ADB8">tracked rank, kept as history</text>
      <text x="262" y="352" font-size="15" fill="#FF8A5C">position 11 &#8594; 6 &#8594; 3</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.72;0.8;0.92;1" dur="9s" repeatCount="indefinite"/>
      <rect x="380" y="316" width="176" height="34" rx="17" fill="#FF5C22"/>
      <text x="468" y="339" font-size="15" font-weight="600" fill="#101216" text-anchor="middle">Waiting for your yes</text>
    </g>
  </g>

  <!-- Lifecycle loop -->
  <g>
    <path id="loopPath" d="M 880,128 a 118,118 0 1,1 -0.01,0" fill="none" stroke="#2B303A" stroke-width="2.5" stroke-dasharray="7 9"/>
    <circle r="9" fill="#FF5C22">
      <animateMotion dur="8s" repeatCount="indefinite" rotate="auto">
        <mpath href="#loopPath"/>
      </animateMotion>
    </circle>

    <g text-anchor="middle" font-size="16" font-weight="600">
      <g>
        <circle cx="880" cy="128" r="27" fill="#171A20" stroke="#FF5C22" stroke-width="2">
          <animate attributeName="r" values="27;31;27" dur="2s" begin="0s" repeatCount="indefinite"/>
        </circle>
        <text x="880" y="94" fill="#FFFFFF">Plan</text>
        <text x="880" y="72" font-size="13" font-weight="400" fill="#7C828E">research first</text>
      </g>
      <g>
        <circle cx="998" cy="246" r="27" fill="#171A20" stroke="#FF5C22" stroke-width="2">
          <animate attributeName="r" values="27;31;27" dur="2s" begin="0.5s" repeatCount="indefinite"/>
        </circle>
        <text x="1052" y="240" fill="#FFFFFF">Build</text>
        <text x="1052" y="262" font-size="13" font-weight="400" fill="#7C828E">pages + setup</text>
      </g>
      <g>
        <circle cx="880" cy="364" r="27" fill="#171A20" stroke="#FF5C22" stroke-width="2">
          <animate attributeName="r" values="27;31;27" dur="2s" begin="1s" repeatCount="indefinite"/>
        </circle>
        <text x="880" y="418" fill="#FFFFFF">Publish</text>
      </g>
      <g>
        <circle cx="762" cy="246" r="27" fill="#171A20" stroke="#FF5C22" stroke-width="2">
          <animate attributeName="r" values="27;31;27" dur="2s" begin="1.5s" repeatCount="indefinite"/>
        </circle>
        <text x="700" y="240" fill="#FFFFFF">Check</text>
        <text x="700" y="262" font-size="13" font-weight="400" fill="#7C828E">weekly</text>
      </g>
    </g>
    <text x="880" y="240" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">then keep</text>
    <text x="880" y="264" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">improving</text>
  </g>
</svg>
